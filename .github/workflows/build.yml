name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build and test
        run: |
          xcodebuild test \
            -project CursorFocus.xcodeproj \
            -scheme CursorFocus \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            | tail -40
          exit ${PIPESTATUS[0]}
